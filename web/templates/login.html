{{define "content"}}
<section class="login">
  <h1>RuangDB</h1>
  <p class="muted">Masuk dengan akun yang diberikan admin.</p>

  {{if .Error}}<p class="alert error">{{.Error}}</p>{{end}}

  <form method="post" action="/login">
    <label>Username
      <input name="username" value="{{.Username}}" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="primary" type="submit">Masuk</button>
  </form>
</section>
{{end}}
