apiVersion: 1
datasources:
  - name: Prometheus
    uid: metrics
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: logs
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: traces
          url: '$${__value.raw}'
  - name: Tempo
    uid: traces
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: logs
        filterByTraceID: true
        filterBySpanID: false
        tags: [service.name]
